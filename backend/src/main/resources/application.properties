spring.application.name=Personnel Office
server.port=${PORT:8080}
server.address=127.0.0.1
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ems}
spring.datasource.username=${DB_USER:ems}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
app.jwt-secret=${JWT_SECRET}
app.encryption-key=${ENCRYPTION_KEY}
app.cookie-secure=${COOKIE_SECURE:false}
app.demo-password=${DEMO_PASSWORD:}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.csrf.enabled=true
